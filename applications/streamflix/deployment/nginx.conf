# ==============================================================================
# StreamFlix Lab — Nginx Reverse Proxy & HTTP Range Video Delivery
# Deployed on APP01 (192.168.10.20)
# ==============================================================================

server {
    listen 80;
    server_name streamflix.local app01.local;

    # 1. React Frontend Static Build
    location / {
        root /var/www/streamflix/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Node.js Express API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Static Media & Video Streaming (Mounted from FILE01: 192.168.10.40)
    # Supports HTTP Range Requests (Byte Serving) for Video Seeking
    location /media/ {
        alias /mnt/file01/media/;
        autoindex off;
        
        # Enable Byte-Range Requests for Smooth HTML5 Video Scrubbing
        slice             1m;
        proxy_cache_key   $uri$slice_range;
        proxy_set_header  Range $slice_range;
        proxy_http_version 1.1;

        # Caching & Optimization
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 1d;
        add_header Accept-Ranges bytes;
    }
}
